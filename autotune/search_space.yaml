embedding_dim: [64, 128, 256, 512]
encoder: [GRU, BiGRU, LSTM, BiLSTM]
hidden: [96, 128, 192, 256, 384, 512]
layers: [1, 2, 3]
embedding_mlp: [false, true]
self_attention: [false, true]
heads: [1, 2, 4, 8]
residual: [false, true]
dropout: [0.05, 0.50]
learning_rate_log10: [-4.0, -2.0]
weight_decay_log10: [-6.0, -2.0]
batch_size: auto_by_gpu_profile
max_len: [4096, 8192, 12288, 16384]
gradient_clip: [0.5, 1.0, 2.0]
optimizer: [Adam, AdamW]
scheduler: [none, cosine, plateau]
conditional_rules:
  - self_attention=false -> do_not_sample_heads
  - encoder=GRU -> bidirectional=false
  - encoder=BiGRU -> bidirectional=true
  - encoder=LSTM -> bidirectional=false
  - encoder=BiLSTM -> bidirectional=true

