experiment_name: fusion_stage14a_bjut_random
output_dir: results/fusion_stage14a/bjut_random
summary_path: data/reports/stage14a_fusion_bjut_random_summary
split_policy: random_sample_split
strict_grouped_split: false
test_leakage: true
warning: Paper-style upper bound only. The random split has train-test opcode-hash overlap and the encoder used BJUT full-corpus MLM.
seed: 42
bootstrap_samples: 1000
max_models_per_fusion: 2
fusion_types: [logit, probability]
current_best_macro_f1: 0.575692

models:
  - name: chunk_mil
    valid_path: results/train_continued_dive_evm_bert_bjut_random_stride256_mil/valid_predictions.jsonl
    test_path: results/train_continued_dive_evm_bert_bjut_random_stride256_mil/test_predictions.jsonl
  - name: chunk_context
    valid_path: results/train_continued_dive_evm_bert_bjut_random_stride256_context_mil/valid_predictions.jsonl
    test_path: results/train_continued_dive_evm_bert_bjut_random_stride256_context_mil/test_predictions.jsonl

reference_baselines:
  random_no_context:
    micro_f1: 0.655448
    macro_f1: 0.546136
    detection_f1: 0.782955
  random_chunk_context:
    micro_f1: 0.686971
    macro_f1: 0.575692
    detection_f1: 0.787745

label_names:
  - Reentrancy
  - Contract contains unknown address
  - Integer overflow or underflow
  - Timestamp dependence
  - DoS with failed call
  - Assert violation
  - Unchecked call return value
  - Unsafe send
  - Multiplication after division
  - Extra gas consumption
