experiment_name: extract_dive_effect_flow_chunks_mean_stride256
hf_model_path: checkpoints/pretrain_effect_flow_evm_bert_bjut_dive_train_balanced/hf_model
vocab_path: data/processed/BJUT_SC01/evm_vocab.json
data_dir: data/processed/DIVE_random_split

train_path: data/processed/DIVE_random_split/train_mlsmote.jsonl
valid_path: data/processed/DIVE_random_split/valid.jsonl
test_path: data/processed/DIVE_random_split/test.jsonl

output_dir: data/features/effect_flow_evm_bert_chunks_mean_stride256/DIVE
report_dir: data/reports
log_dir: logs

num_labels: 8
max_len: 512
chunk_content_size: 510
chunk_stride: 256
max_chunks_per_contract: 32
batch_size: 64
num_workers: 4
fp16: true
pooling: masked_mean

is_transductive_pretraining: true
base_encoder_init: BJUT full-corpus EVM-BERT
