continued_encoder: MOM + ETP + EFPP effect-flow-aware continued pretraining
split_policy: random_sample_split
leakage_warning: Match the current DIVE chunk-context baseline max_chunks=32; do not change max_chunks only for the new encoder.

label_names:
  - Reentrancy
  - Access Control
  - Arithmetic
  - Unchecked Return Values
  - DoS
  - Bad Randomness
  - Front Running
  - Time manipulation

