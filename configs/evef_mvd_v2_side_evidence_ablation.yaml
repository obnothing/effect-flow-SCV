output_config_dir: configs/generated/evef_mvd_v2_ablation
output_root: results/ablation_evef_mvd_v2
checkpoint_root: checkpoints/ablation_evef_mvd_v2

datasets:
  BJUT:
    base_config: configs/train_bjut_evef_mvd_v2_side_evidence.yaml
    experiment_prefix: train_bjut
  DIVE:
    base_config: configs/train_dive_evef_mvd_v2_side_evidence.yaml
    experiment_prefix: train_dive

variants:
  - name: no_side
    description: Strong chunk-context label-wise MIL without effect-flow side evidence.
    side_evidence: false
    overrides:
      model_type: evm_chunk_mil
      semantic_feature_dir:
      effect_flow_semantic_mode:
      semantic_fusion:
      use_weak_semantic_features: false

  - name: side_scale_025
    description: Weak side evidence, all behavior coefficients scaled to 0.25.
    side_evidence: true
    coefficient_scale: 0.25
    overrides:
      risk_evidence_weight: 0.25
      missing_check_evidence_weight: 0.25
      protective_evidence_weight: 0.25
      effect_type_evidence_weight: 0.125
      relation_evidence_weight: 0.125
      beta_reliable_init: 0.05
      gamma_reliable_init: 0.05

  - name: side_scale_050
    description: Medium-low side evidence, all behavior coefficients scaled to 0.50.
    side_evidence: true
    coefficient_scale: 0.50
    overrides:
      risk_evidence_weight: 0.50
      missing_check_evidence_weight: 0.50
      protective_evidence_weight: 0.50
      effect_type_evidence_weight: 0.25
      relation_evidence_weight: 0.25
      beta_reliable_init: 0.075
      gamma_reliable_init: 0.075

  - name: side_scale_100
    description: Default balanced side evidence.
    side_evidence: true
    coefficient_scale: 1.00
    overrides:
      risk_evidence_weight: 1.0
      missing_check_evidence_weight: 1.0
      protective_evidence_weight: 1.0
      effect_type_evidence_weight: 0.5
      relation_evidence_weight: 0.5
      beta_reliable_init: 0.1
      gamma_reliable_init: 0.1

  - name: side_scale_200
    description: Strong side evidence, all behavior coefficients scaled to 2.00.
    side_evidence: true
    coefficient_scale: 2.00
    overrides:
      risk_evidence_weight: 2.0
      missing_check_evidence_weight: 2.0
      protective_evidence_weight: 2.0
      effect_type_evidence_weight: 1.0
      relation_evidence_weight: 1.0
      beta_reliable_init: 0.15
      gamma_reliable_init: 0.15

  - name: side_mechanism_weighted
    description: Mechanism-weighted side evidence, emphasizing missing-check behavior.
    side_evidence: true
    coefficient_scale: custom
    overrides:
      risk_evidence_weight: 1.5
      missing_check_evidence_weight: 2.0
      protective_evidence_weight: 1.5
      effect_type_evidence_weight: 0.75
      relation_evidence_weight: 0.75
      beta_reliable_init: 0.15
      gamma_reliable_init: 0.15
