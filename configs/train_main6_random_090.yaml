common:
  data_dir: data/processed/DIVE_main6_random_split
  source_label_names: [Reentrancy, Access Control, Arithmetic, Unchecked Return Values, DoS, Time manipulation]
  label_names: [Reentrancy, Access Control, Arithmetic, Unchecked Return Values, DoS, Time manipulation]
  num_labels: 6
  feature_dim: 768
  hidden_dim: 512
  attn_dim: 256
  max_chunks: 64
  dropout: 0.1
  task_mode: recognition_only
  detection_head_enabled: false
  detection_loss_weight: 0.0
  recognition_loss_weight: 1.0
  derived_detection_from_multilabel: true
  recognition_head_type: label_branch_mlp
  label_branch_hidden_dim: 256
  label_branch_dropout: 0.1
  label_branch_use_layernorm: true
  use_chunk_context: true
  chunk_context_encoder_type: transformer
  chunk_context_num_layers: 2
  chunk_context_num_heads: 8
  chunk_context_dropout: 0.1
  recognition_aggregation: label_gated_attention
  batch_size: 32
  gradient_accumulation_steps: 4
  num_workers: 4
  epochs: 80
  early_stopping_patience: 15
  learning_rate: 0.0001
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  scheduler: cosine
  scheduler_warmup_epochs: 3
  min_learning_rate: 0.000001
  use_pos_weight: true
  pos_weight_mode: sqrt_ratio
  max_pos_weight: 5.0
  exclude_augmented_ids: true
  threshold: 0.5
  thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  seed: 42
  encoder_frozen: true
  is_transductive_pretraining: false
  split_policy: random_split_train_only_pretraining
  leakage_status: random_split_no_label_retrieval
  ablation_dataset: DIVE_Main6
  num_effect_types: 17
  etp_embedding_dim: 64
  etp_query_slots: 2
  etp_max_len: 512
  etp_cross_attention_heads: 4
  etp_cross_attention_dropout: 0.1
  sep_margin: 0.5
variants:
  mlm_label_mil:
    experiment_name: main6_mlm_label_mil
    model_type: evm_chunk_mil
    feature_dir: data/features/main6_random_mlm_control_trainvalid
    checkpoint_dir: checkpoints/main6_random_090/mlm_label_mil
    result_dir: results/main6_random_090/mlm_label_mil
  etp_encoder_mil:
    experiment_name: main6_etp_encoder_mil
    model_type: evm_chunk_mil
    feature_dir: data/features/main6_random_multirole_etp
    checkpoint_dir: checkpoints/main6_random_090/etp_encoder_mil
    result_dir: results/main6_random_090/etp_encoder_mil
  etp_concat_mil:
    experiment_name: main6_etp_concat_mil
    model_type: ld_etp_cross_attention_mil
    feature_dir: data/features/main6_random_multirole_etp
    token_semantic_dir: data/features/main6_random_multirole_etp_tokens
    checkpoint_dir: checkpoints/main6_random_090/etp_concat_mil
    result_dir: results/main6_random_090/etp_concat_mil
    lambda_sep: 0.0
    etp_concat_only: true
  ld_etpca:
    experiment_name: main6_ld_etpca
    model_type: ld_etp_cross_attention_mil
    feature_dir: data/features/main6_random_multirole_etp
    token_semantic_dir: data/features/main6_random_multirole_etp_tokens
    checkpoint_dir: checkpoints/main6_random_090/ld_etpca
    result_dir: results/main6_random_090/ld_etpca
    lambda_sep: 0.0
  ld_etpca_sep:
    experiment_name: main6_ld_etpca_sep
    model_type: ld_etp_cross_attention_mil
    feature_dir: data/features/main6_random_multirole_etp
    token_semantic_dir: data/features/main6_random_multirole_etp_tokens
    checkpoint_dir: checkpoints/main6_random_090/ld_etpca_sep
    result_dir: results/main6_random_090/ld_etpca_sep
    lambda_sep: 0.05
