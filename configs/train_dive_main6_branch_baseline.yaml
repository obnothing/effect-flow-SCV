experiment_name: dive_main6_branch_baseline
model_type: evef_mvd_v2_side_evidence_mil
feature_dir: data/features/continued_dive_evm_bert_dive_random_stride256_max64
semantic_feature_dir: data/features/effect_flow_semantics/dive_random_stride256_max64
checkpoint_dir: checkpoints/dive_main6_branch_baseline
result_dir: results/dive_main6_branch_baseline
report_dir: data/reports
log_dir: logs
data_dir: data/processed/DIVE_main6_random_split
ontology_path: configs/effect_flow_ontology.yaml
template_path: configs/vulnerability_templates_dive.yaml
efpp_pattern_config: configs/effect_flow_efpp_conservative_22.json

# The frozen caches remain eight-label artifacts; the loader projects them by name.
source_label_names:
  - Reentrancy
  - Access Control
  - Arithmetic
  - Unchecked Return Values
  - DoS
  - Bad Randomness
  - Front Running
  - Time manipulation
label_names:
  - Reentrancy
  - Access Control
  - Arithmetic
  - Unchecked Return Values
  - DoS
  - Time manipulation
num_labels: 6

feature_dim: 768
hidden_dim: 512
attn_dim: 256
max_chunks: 64
chunk_stride: 256
feature_pooling: masked_mean
dropout: 0.1

task_mode: recognition_only
detection_head_enabled: false
detection_loss_weight: 0.0
recognition_loss_weight: 1.0
derived_detection_from_multilabel: true
recognition_head_type: label_branch_mlp
label_branch_hidden_dim: 256
label_branch_dropout: 0.1
label_branch_use_layernorm: true

use_chunk_context: true
chunk_context_encoder_type: transformer
chunk_context_num_layers: 2
chunk_context_num_heads: 8
chunk_context_dropout: 0.1
recognition_aggregation: label_gated_attention
top_k: 2

side_evidence_enabled: true
coefficient_scale: 1.5
effect_flow_semantic_mode: reliable_side_evidence
semantic_fusion: side_evidence_bias
semantic_dropout: 0.2
efpp_dim: 22
etp_dim: 16
relation_dim: 6
lambda_gate: 0.0001
warmup_epochs_neural_only: 3
enable_reliable_semantic_epoch: 4
use_weak_semantic_features: false
beta_reliable_init: 0.125
gamma_reliable_init: 0.125
risk_evidence_weight: 1.5
missing_check_evidence_weight: 1.5
protective_evidence_weight: 1.5
effect_type_evidence_weight: 0.75
relation_evidence_weight: 0.75

# Keep prior failed rare-label and graph routes disabled in the six-label baseline.
front_running_special_enabled: false
front_hard_negative_loss_enabled: false
front_contrastive_loss_enabled: false
rare_negative_subsampling_enabled: false
graph_evidence_enabled: false
major_global_residual_enabled: false
major_multipool_enabled: false

batch_size: 128
gradient_accumulation_steps: 1
num_workers: 4
epochs: 80
early_stopping_patience: 15
learning_rate: 0.0001
weight_decay: 0.01
gradient_clip_norm: 1.0
scheduler: cosine
scheduler_warmup_epochs: 3
min_learning_rate: 0.000001
use_pos_weight: true
pos_weight_mode: sqrt_ratio
max_pos_weight: 5.0
exclude_augmented_ids: true

threshold: 0.5
thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
seed: 42
encoder_frozen: true
is_transductive_pretraining: true
split_policy: inherited_dive_random_split
leakage_status: warning
ablation_dataset: DIVE_Main6
ablation_variant: branch_baseline
ablation_description: Six-label DIVE projection with shared backbone, label MLP branches, and reliable side evidence.
