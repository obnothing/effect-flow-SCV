output_config_dir: configs/generated/dive_front_running_special_search
output_root: results/dive_front_running_special_search
checkpoint_root: checkpoints/dive_front_running_special_search

datasets:
  DIVE:
    base_config: configs/generated/dive_side_scale_search/train_dive_side_scale_150_ep50.yaml
    experiment_prefix: train_dive

variants:
  - name: front_special_only
    description: Front Running special evidence without confounder suppression or hard-negative loss.
    side_evidence: true
    coefficient_scale: 1.50
    overrides:
      front_special_feature_dir: data/features/front_running_special/dive_random_stride256_max64
      front_running_special_enabled: true
      front_running_label_name: Front Running
      front_running_generic_pattern_scale: 0.25
      front_running_special_risk_weight: 1.0
      front_running_special_protective_weight: 1.0
      front_running_confounder_suppression_weight: 0.0
      front_running_confounder_margin: 0.1
      front_running_confounder_labels: [Access Control, Reentrancy]
      front_hard_negative_loss_enabled: false
      front_hard_negative_lambda: 0.0
      front_hard_negative_prob_threshold: 0.5
      front_hard_negative_margin_logit: 0.0
      front_hard_negative_confounder_labels: [Access Control, Reentrancy]
      front_special_feature_dim: 15
      front_special_feature_names:
        - approve_selector
        - transfer_from_selector
        - transfer_selector
        - allowance_selector
        - balance_of_selector
        - swap_selector_family
        - buy_sell_bid_order_text
        - price_amount_balance_text
        - calldata_to_state_write
        - calldata_to_external_call
        - external_call_then_state_write
        - state_write_then_external_call
        - deadline_or_time_guard_text
        - slippage_or_min_amount_text
        - commit_reveal_text

