common:
  route_name: DIVE Main6 Opcode-LSE-MIL
  data_dir: data/processed/DIVE_main6_random_split
  # Read-only reuse of the opcode sequence cache; no graph cache is loaded.
  feature_dir: data/features/main6_opcode_csdg/sequence
  label_names: [Reentrancy, Access Control, Arithmetic, Unchecked Return Values, DoS, Time manipulation]
  num_labels: 6
  num_views: 8
  feature_dim: 768
  hidden_dim: 256
  max_chunks: 64
  evidence_slots: 3
  evidence_topk_chunks: 8
  context_layers: 2
  context_heads: 8
  dropout: 0.1
  seed: 42
  batch_size: 16
  gradient_accumulation_steps: 4
  num_workers: 4
  epochs: 80
  early_stopping_patience: 15
  learning_rate: 0.0001
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  scheduler_warmup_epochs: 3
  min_learning_rate: 0.000001
  max_pos_weight: 5.0
  diversity_loss_weight: 0.05
  thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  baseline_summary: results/main6_random_090_mlm8/mlm8_slot3/checkpoint_summary.json
  split_policy: random_split_train_only_pretraining
  leakage_status: random_split_no_label_retrieval
variants:
  view_cls:
    checkpoint_dir: checkpoints/main6_opcode_view_ablation/view_cls
    result_dir: results/main6_opcode_view_ablation/view_cls
    view_indices: [0]
    context_view_index: 0
  view_mean:
    checkpoint_dir: checkpoints/main6_opcode_view_ablation/view_mean
    result_dir: results/main6_opcode_view_ablation/view_mean
    view_indices: [1]
    context_view_index: 0
  view_max:
