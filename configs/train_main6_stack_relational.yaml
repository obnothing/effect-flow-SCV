common:
  route_name: DIVE Main6 Opcode-Stack-Relational
  data_dir: data/processed/DIVE_main6_random_split
  feature_dir: data/features/main6_opcode_stack_relational/v2
  encoder_feature_dir: data/features/main6_opcode_stack_relational/v2/stack_aware_encoder
  hf_model_path: checkpoints/pretrain_evm_bert_main6_random_train_mlm8/hf_model
  stack_aware_mlm_checkpoint: checkpoints/main6_opcode_stack_relational/v2/stack_aware_mlm.pt
  vocab_path: checkpoints/pretrain_evm_bert_main6_random_train_mlm8/evm_vocab.json
  train_path: data/processed/DIVE_main6_random_split/train.jsonl
  valid_path: data/processed/DIVE_main6_random_split/valid.jsonl
  test_path: data/processed/DIVE_main6_random_split/test.jsonl
  checkpoint_dir: checkpoints/main6_opcode_stack_relational/v2
  result_dir: results/main6_opcode_stack_relational/v2
  cached_checkpoint_dir: checkpoints/main6_opcode_stack_relational/v2/cached_mil
  cached_result_dir: results/main6_opcode_stack_relational/v2/cached_mil
  label_names: [Reentrancy, Access Control, Arithmetic, Unchecked Return Values, DoS, Time manipulation]
  num_labels: 6
  num_views: 8
  feature_dim: 768
  max_len: 512
  chunk_stride: 256
  max_chunks: 64
  allow_test_cache: false
  seed: 42
  batch_size: 1
  num_workers: 0
  epochs: 20
  early_stopping_patience: 6
  learning_rate: 0.0001
  encoder_learning_rate: 0.00001
  weight_decay: 0.01
  gradient_accumulation_steps: 8
  gradient_clip_norm: 1.0
  encoder_chunk_microbatch: 1
  encoder_frozen: true
  # The default downstream experiment uses a train-only frozen encoder cache.
  # The live encoder path remains available with use_cached_encoder_features=false.
  use_cached_encoder_features: true
  feature_extract_batch_size: 1
  cached_batch_size: 16
  cached_epochs: 30
  cached_early_stopping_patience: 5
  cached_learning_rate: 0.0001
  cached_weight_decay: 0.05
  fp16: true
  hidden_dim: 512
  attn_dim: 256
  dropout: 0.1
  recognition_head_type: label_branch_mlp
  recognition_aggregation: label_gated_attention
  use_chunk_context: true
  chunk_context_num_layers: 1
  chunk_context_num_heads: 8
  chunk_context_dropout: 0.1
  label_branch_hidden_dim: 256
  label_branch_dropout: 0.1
  label_branch_use_layernorm: true
  label_query_slots: 3
  view_residual_init: 0.1
  use_pos_weight: true
  max_pos_weight: 5.0
  scheduler_warmup_epochs: 2
  selection_metric: fixed_macro_f1
  thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  baseline_summary: results/main6_random_090_mlm8/mlm8_slot3/valid_summary.json
  mlm_epochs: 3
  mlm_batch_size: 1
  mlm_learning_rate: 0.00001
  mlm_fp16: false
  mlm_bf16: true
