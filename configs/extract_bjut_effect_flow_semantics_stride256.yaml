experiment_name: extract_bjut_effect_flow_semantics_stride256
hf_model_path: checkpoints/pretrain_effect_flow_evm_bert_bjut_dive_train_balanced/hf_model
vocab_path: data/processed/BJUT_SC01/evm_vocab.json
data_dir: data/processed/BJUT_SC01_random_split

train_path: data/processed/BJUT_SC01_random_split/train_mlsmote.jsonl
valid_path: data/processed/BJUT_SC01_random_split/valid.jsonl
test_path: data/processed/BJUT_SC01_random_split/test.jsonl

reference_feature_dir: data/features/continued_dive_evm_bert_bjut_random_stride256
output_dir: data/features/effect_flow_semantics/bjut_random_stride256_max32
report_dir: data/reports
log_dir: logs

num_labels: 10
max_len: 512
chunk_content_size: 510
chunk_stride: 256
max_chunks_per_contract: 32
batch_size: 64
num_workers: 4
fp16: true

label_names:
  - Reentrancy
  - Contract contains unknown address
  - Integer overflow or underflow
  - Timestamp dependence
  - DoS with failed call
  - Assert violation
  - Unchecked call return value
  - Unsafe send
  - Multiplication after division
  - Extra gas consumption

