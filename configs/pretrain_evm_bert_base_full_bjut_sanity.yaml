experiment_name: pretrain_evm_bert_base_full_bjut_sanity
model_type: evm_bert_base
tokenizer_type: evm

vocab_path: data/processed/BJUT_SC01/evm_vocab.json
pretrain_corpus_path: data/processed/BJUT_SC01/pretrain_corpus_full_bjut_sanity.jsonl

data_paths:
  train: data/processed/BJUT_SC01/train.jsonl
  valid: data/processed/BJUT_SC01/valid.jsonl
  test: data/processed/BJUT_SC01/test.jsonl

checkpoint_dir: checkpoints/pretrain_evm_bert_base_full_bjut_sanity
result_dir: results/pretrain_evm_bert_base_full_bjut_sanity
report_dir: data/reports
log_dir: logs

is_transductive_pretraining: true
use_labels: false

max_len: 512
chunk_content_size: 510
chunk_stride: 510
max_chunks_per_contract: 4
debug_num_contracts: 2048
debug_num_samples: 2048
mlm_probability: 0.15

bert_config:
  vocab_size: auto
  hidden_size: 768
  num_hidden_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  max_position_embeddings: 512
  type_vocab_size: 2
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  hidden_act: gelu
  initializer_range: 0.02

batch_size: 4
gradient_accumulation_steps: 4
effective_batch_size: 16
learning_rate: 1e-4
weight_decay: 0.01
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1e-8
warmup_ratio: 0.06
epochs: 1
max_grad_norm: 1.0
seed: 42
num_workers: 4

fp16: true
bf16: false
save_every_epoch: true
save_best_mlm_loss: true
logging_steps: 10
