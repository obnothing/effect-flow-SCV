output_config_dir: configs/generated/dive_side_scale_search
output_root: results/dive_side_scale_search
checkpoint_root: checkpoints/dive_side_scale_search

datasets:
  DIVE:
    base_config: configs/train_dive_evef_mvd_v2_side_evidence.yaml
    experiment_prefix: train_dive

variants:
  - name: side_scale_150_ep50
    description: DIVE simple side-scale search, coefficient scale 1.50, 50 epochs.
    side_evidence: true
    coefficient_scale: 1.50
    overrides:
      epochs: 50
      early_stopping_patience: 10
      risk_evidence_weight: 1.5
      missing_check_evidence_weight: 1.5
      protective_evidence_weight: 1.5
      effect_type_evidence_weight: 0.75
      relation_evidence_weight: 0.75
      beta_reliable_init: 0.125
      gamma_reliable_init: 0.125
      behavior_weight_path:
      weighted_behavior_scoring:

