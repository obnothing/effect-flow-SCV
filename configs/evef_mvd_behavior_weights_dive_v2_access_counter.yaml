name: dive_weight_search_v2_access_counter
dataset: DIVE
learnable: false
score_normalization: none
relation_schema: split
pattern_source: configs/effect_flow_efpp_conservative_22.json
ontology_path: configs/effect_flow_ontology.yaml

labels:
  Reentrancy:
    risk_patterns:
      call_before_state_write: 2.0
      has_external_call: 2.0
      value_or_gas_sensitive_call: 1.0
    missing_check_patterns:
      call_without_return_check: 2.0
    protective_patterns:
      call_with_return_check: 2.0
    effect_types:
      ExternalCall: 0.5
      StateWrite: 0.5
    risk_relations:
      call_then_state_write: 1.0
    missing_relations: {}
    protective_relations: {}

  Access Control:
    risk_patterns:
      has_state_write: 0.75
    missing_check_patterns:
      state_write_without_auth_guard: 1.5
    protective_patterns:
      state_write_with_auth_guard: 4.0
      sensitive_call_with_auth_guard: 4.0
    effect_types:
      StateWrite: 0.5
    risk_relations: {}
    missing_relations: {}
    protective_relations:
      state_write_then_auth_guard: 3.0

  Arithmetic:
    risk_patterns:
      div_before_mul: 2.0
      has_state_write: 1.0
    missing_check_patterns:
      state_write_without_auth_guard: 0.25
    protective_patterns:
      panic_selector_present: 2.0
    effect_types:
      Arithmetic: 0.5
    risk_relations:
      div_then_mul: 1.0
    missing_relations: {}
    protective_relations: {}

  Unchecked Return Values:
    risk_patterns:
      has_external_call: 2.0
      value_or_gas_sensitive_call: 1.0
    missing_check_patterns:
      call_without_return_check: 2.0
    protective_patterns:
      call_with_return_check: 2.0
    effect_types:
      ExternalCall: 0.5
      ReturnCheck: 0.5
    risk_relations: {}
    missing_relations: {}
    protective_relations:
      call_then_return_check: 1.0

  DoS:
    risk_patterns:
      has_external_call: 2.0
      value_or_gas_sensitive_call: 1.0
      dense_storage_or_call_ops: 0.25
    missing_check_patterns:
      call_without_return_check: 2.0
    protective_patterns:
      call_with_return_check: 2.0
    effect_types:
      ExternalCall: 0.5
      GasOrValue: 0.5
      StorageOrMemoryHeavy: 0.5
    risk_relations: {}
    missing_relations: {}
    protective_relations:
      call_then_return_check: 1.0

  Bad Randomness:
    risk_patterns:
      env_used_in_arithmetic_or_hash: 2.0
      env_used_in_condition: 1.0
    missing_check_patterns:
      state_write_without_auth_guard: 0.25
    protective_patterns:
      call_with_return_check: 0.25
    effect_types:
      EnvDependency: 0.5
      HashOrCrypto: 0.5
    risk_relations:
      env_then_branch: 1.0
    missing_relations: {}
    protective_relations: {}

  Front Running:
    risk_patterns:
      sensitive_call_without_auth_guard: 2.0
      value_or_gas_sensitive_call: 0.5
      has_external_call: 0.25
    missing_check_patterns:
      sensitive_call_without_auth_guard: 2.0
    protective_patterns:
      sensitive_call_with_auth_guard: 2.5
    effect_types:
      ExternalCall: 0.1
      GasOrValue: 0.1
    risk_relations: {}
    missing_relations: {}
    protective_relations: {}

  Time manipulation:
    risk_patterns:
      env_used_in_condition: 2.0
      env_used_in_arithmetic_or_hash: 1.0
    missing_check_patterns:
      state_write_without_auth_guard: 0.25
    protective_patterns:
      call_with_return_check: 0.25
    effect_types:
      EnvDependency: 0.5
    risk_relations:
      env_then_branch: 1.0
    missing_relations: {}
    protective_relations: {}
