output_config_dir: configs/generated/dive_sampler_asl_search
output_root: results/dive_sampler_asl_search
checkpoint_root: checkpoints/dive_sampler_asl_search

datasets:
  DIVE:
    base_config: configs/generated/dive_side_scale_search/train_dive_side_scale_150_ep50.yaml
    experiment_prefix: train_dive

variants:
  - name: side_scale_150_sampler_bce
    description: DIVE side_scale_150 with label-balanced sampler, BCE, and pos_weight.
    side_evidence: true
    coefficient_scale: 1.5
    overrides:
      train_sampler: label_balanced
      sampler_max_sample_weight: 10.0
      recognition_loss_type: bce
      use_pos_weight: true

  - name: side_scale_150_asl
    description: DIVE side_scale_150 with ASL, ordinary shuffle, and no pos_weight.
    side_evidence: true
    coefficient_scale: 1.5
    overrides:
      train_sampler: shuffle
      recognition_loss_type: asl
      use_pos_weight: false
      asl_gamma_neg: 4.0
      asl_gamma_pos: 0.0
      asl_clip: 0.05
      asl_eps: 1.0e-8

  - name: side_scale_150_sampler_asl
    description: DIVE side_scale_150 with label-balanced sampler, ASL, and no pos_weight.
    side_evidence: true
    coefficient_scale: 1.5
    overrides:
      train_sampler: label_balanced
      sampler_max_sample_weight: 10.0
      recognition_loss_type: asl
      use_pos_weight: false
      asl_gamma_neg: 4.0
      asl_gamma_pos: 0.0
      asl_clip: 0.05
      asl_eps: 1.0e-8
