  front_r1_lr100: &front_base
    experiment_name: dive_classicnet_front_r1_lr100
    checkpoint_dir: checkpoints/dive_classicnet_escort/front_r1_lr100
    result_dir: results/dive_classicnet_escort/members/front_r1_lr100
    num_labels: 7
    label_names: &front_labels [Reentrancy, Access Control, Arithmetic, Unchecked Return Values, DoS, Time manipulation, Front Running]
